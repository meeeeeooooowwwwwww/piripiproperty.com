name: Piripi Property | Independent Cloudflare Pages deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

concurrency:
  group: piripiproperty-pages-main
  cancel-in-progress: true

jobs:
  deploy:
    name: Validate and deploy piripiproperty only
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_ACCOUNT_ID: 0ac8cf282bbdc382ef6afb38b2ca79c7
      CLOUDFLARE_API_TOKEN: ${{ secrets.PIRIPIPROPERTY_CLOUDFLARE_API_TOKEN }}
    steps:
      - name: Checkout this repository only
        uses: actions/checkout@v4

      - name: Set up Python to render social preview
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Generate share image for Facebook and X
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check Pillow==12.0.0
          python scripts/build_social_image.py

      - name: Validate standalone static site
        shell: bash
        run: |
          set -euo pipefail
          test -s public/index.html
          test -s public/social-preview.jpg
          grep -q 'og:image' public/index.html
          grep -q 'Corrie Piripi' public/index.html
          grep -q 'application/ld+json' public/index.html
          grep -Fq '<meta property="og:site_name" content="Piripi &amp; Sons Real Estate">' public/index.html
          for page in public/index.html public/contact/index.html public/sitemap/index.html; do
            grep -Fq 'Piripi &amp; Sons Real Estate' "$page"
            ! grep -Fq 'Piripi Property Limited' "$page"
            ! grep -Fq 'registration pending' "$page"
            grep -Fq 'https://piripiproperty.com/social-preview.jpg?v=' "$page"
          done
          python - <<'PY'
          import json
          import pathlib
          import re
          for path in pathlib.Path("public").rglob("index.html"):
              doc = path.read_text()
              match = re.search(r'<script type="application/ld\+json">([^<]+)</script>', doc)
              assert match, f"Missing JSON-LD: {path}"
              graph = json.loads(match.group(1))["@graph"]
              assert any(item.get("@type") == "Brand" and item.get("name") == "Piripi & Sons Real Estate" for item in graph), f"Wrong brand schema: {path}"
              assert any(item.get("@type") == "Person" and item.get("name") == "Corrie Piripi" for item in graph), f"Person absent: {path}"
          PY
          ! grep -q 'noindex' public/index.html
          test -s public/robots.txt
          test -s public/sitemap.xml
          test -s public/contact/index.html
          test -s public/sitemap/index.html
          grep -Fq 'tel:+64221748354' public/contact/index.html
          grep -Fq '>+64 22 174 8354</a>' public/contact/index.html
          grep -Fq '>corrie@piripiproperty.com</a>' public/contact/index.html
          ! grep -Fq 'Email: corrie@piripiproperty.com' public/contact/index.html
          grep -Fq 'https://piripiproperty.com/contact/' public/sitemap.xml
          grep -Fq 'https://piripiproperty.com/sitemap/' public/sitemap.xml
          test -s public/_headers
          test -s public/assets/site.css
          test -s public/assets/brand/logo-horizontal-transparent.svg
          test -s public/assets/brand/mark-gold.svg
          test -s public/favicon.svg
          test -s public/favicon.ico
          test -s public/favicon-32.png
          test -s public/apple-touch-icon.png
          test -s public/site.webmanifest
          ! grep -Fq 'mask-image:' public/assets/site.css
          grep -Fq 'grid-template-columns:minmax(0,1.72fr) minmax(324px,.98fr)' public/assets/site.css
          grep -Fq 'align-items:stretch' public/assets/site.css
          grep -Fq 'object-fit:contain' public/assets/site.css
          grep -Fq '@media (max-width:840px)' public/assets/site.css
          grep -Fq 'class="hero__layout"' public/index.html
          grep -Fq 'id="property-enquiry-form"' public/index.html
          grep -Fq 'id="enquiry-phone" name="phone" type="tel"' public/index.html
          grep -Fq 'id="enquiry-message" name="message" rows="3" maxlength="1500"' public/index.html
          grep -Fq 'name="phone"' public/index.html
          grep -Fq '"Phone: " + phone' functions/api/enquiry.js
          grep -Fq 'action="/api/enquiry"' public/index.html
          test -s functions/api/enquiry.js
          grep -Fq 'api.brevo.com/v3/smtp/email' functions/api/enquiry.js
          ! grep -Fq 'cpiripi@gmail.com' functions/api/enquiry.js
          test -s public/assets/enquiry-form.js
          grep -Fq "social-preview.jpg?v=${GITHUB_SHA:0:12}" public/index.html
          grep -Fq "social-preview.jpg?v=${GITHUB_SHA:0:12}" public/contact/index.html
          grep -Fq "social-preview.jpg?v=${GITHUB_SHA:0:12}" public/sitemap/index.html
          grep -Fq 'Cache-Control: no-cache' public/_headers
          test -s public/assets/piripi-and-sons-real-estate.jpg
          echo "265acac99618176a7d2239a05546697996ea576704b5bfc5b2a646e6c6328a91  public/assets/piripi-and-sons-real-estate.jpg" | sha256sum -c -
          grep -Fq "/assets/piripi-and-sons-real-estate.jpg" public/index.html
          grep -Fq 'body.home {min-height:100dvh;display:flex;flex-direction:column}' public/assets/site.css
          grep -Fq 'class="site-header"' public/index.html
          grep -Fq 'class="site-header"' public/contact/index.html
          grep -Fq 'class="site-header"' public/sitemap/index.html
          grep -Fq 'href="/assets/site.css?v=20261113-aligned-enquiry"' public/index.html
          grep -Fq 'class="inner-page contact-page"' public/contact/index.html
          grep -Fq 'body.contact-page {height:100dvh;min-height:0;overflow:hidden}' public/assets/site.css
          for page in public/index.html public/contact/index.html public/sitemap/index.html; do
            grep -Fq 'class="site-footer__sitemap" href="/sitemap/"' "$page"
            ! sed -n '/<header class="site-header">/,/<\/header>/p' "$page" | grep -Fq '/sitemap/'
          done
          grep -Fq 'href="tel:+64221748354"' public/index.html
          grep -Fq 'src="/assets/enquiry-form.js?v=20261113-aligned-enquiry"' public/index.html
          grep -Fq "connect-src 'self'" public/_headers
          ! grep -q 'href="tel:' public/sitemap/index.html
          ! grep -q 'href="mailto:' public/sitemap/index.html
          grep -q 'GTM-555PWRPR' public/index.html
          grep -q 'googletagmanager.com' public/_headers
          grep -q 'piripiproperty' wrangler.toml
          node --test tests/enquiry-function.test.mjs
          echo "Validated the isolated Piripi Property release."

      - name: Check this repository's Cloudflare token
        id: auth
        shell: bash
        run: |
          if [ -n "${CLOUDFLARE_API_TOKEN:-}" ]; then
            echo 'available=true' >> "$GITHUB_OUTPUT"
          else
            echo 'available=false' >> "$GITHUB_OUTPUT"
            echo "::notice::This repository needs the PIRIPIPROPERTY_CLOUDFLARE_API_TOKEN secret to activate automatic deploys."
          fi

      - name: Check whether this repository can access a Brevo secret
        id: email_auth
        shell: bash
        env:
          BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
        run: |
          if [ -n "${BREVO_API_KEY:-}" ]; then
            echo 'available=true' >> "$GITHUB_OUTPUT"
            echo "Brevo GitHub secret is available to this Piripi Property workflow."
          else
            echo 'available=false' >> "$GITHUB_OUTPUT"
            echo "::notice::BREVO_API_KEY is not available to this repository. The form will use its explicit email-app fallback unless a key is already configured in Cloudflare Pages."
          fi

      - name: Sync available GitHub Brevo secret to this Pages project
        if: steps.auth.outputs.available == 'true' && steps.email_auth.outputs.available == 'true'
        shell: bash
        continue-on-error: true
        env:
          BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
        run: |
          set -euo pipefail
          printf '%s' "$BREVO_API_KEY" | npx --yes wrangler@4 pages secret put BREVO_API_KEY --project-name=piripiproperty
          echo "Brevo secret was transferred securely to Piripi Property Pages."

      - name: Deploy only the piripiproperty Pages project
        if: steps.auth.outputs.available == 'true'
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.PIRIPIPROPERTY_CLOUDFLARE_API_TOKEN }}
          accountId: ${{ env.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy public --project-name=piripiproperty --branch=main
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}

      - name: Check deployed enquiry endpoint readiness (read-only)
        if: steps.auth.outputs.available == 'true'
        shell: bash
        run: |
          python - <<'PY'
          import json, time, urllib.error, urllib.request
          url = "https://piripiproperty.com/api/enquiry"
          for attempt in range(8):
              try:
                  with urllib.request.urlopen(urllib.request.Request(url, headers={"Accept": "application/json", "Cache-Control": "no-cache"}), timeout=12) as response:
                      result = json.load(response)
                  if result.get("ok") is True and isinstance(result.get("ready"), bool):
                      print("PIRIPI_ENQUIRY_ENDPOINT_LIVE=PASS")
                      if result["ready"]:
                          print("PIRIPI_BREVO_PAGES_SECRET_AVAILABLE=YES")
                      else:
                          print("::notice::Cloudflare Pages does not currently expose a configured Brevo key for this website. Its email-app fallback remains in use.")
                      break
                  print("::warning::Enquiry readiness returned unexpected response")
              except Exception as exc:
                  print(f"::notice::Enquiry readiness attempt {attempt+1} did not complete: {type(exc).__name__}")
              time.sleep(2)
          else:
              print("::warning::Could not verify the public enquiry endpoint; do not claim live email delivery.")
          PY
