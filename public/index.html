<!doctype html>
<html lang="en-NZ">
<head>

  <meta name="theme-color" content="#ffffff">

  <meta name="robots" content="noindex,follow">

  <style>
    :root { color-scheme: light; }
    *, *::before, *::after { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; padding: 0; overflow: hidden; }
    body { background: white; }
    main {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100vh;
      height: 100dvh;
      overflow: hidden;
      background-color: white;
      background-image: url('/assets/piripi-property-coming-soon.webp');
      background-repeat: no-repeat;
      background-position: center center;
      background-size: contain;
    }
    .site-credit {
      position: fixed;
      z-index: 2;
      left: max(10px, env(safe-area-inset-left, 0px));
      bottom: max(10px, env(safe-area-inset-bottom, 0px));
      display: inline-flex;
      align-items: center;
      max-width: calc(100vw - 20px);
      min-height: 30px;
      padding: 6px 9px;
      border: 1px solid rgba(30, 45, 55, .13);
      border-radius: 7px;
      background: rgba(255, 255, 255, .90);
      color: #3e4852;
      font: 500 11px/1.25 system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      text-decoration: none;
      white-space: nowrap;
    }
    .site-credit strong { font-weight: 700; margin-left: .3em; }
    .site-credit:hover { color: #142c44; background: #fff; text-decoration: underline; }
    .site-credit:focus-visible { outline: 2px solid #142c44; outline-offset: 3px; }
    .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; border: 0; }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; } }
  </style>
</head>
<body>
  <main role="img" aria-label="A cheerful crayon drawing of a male Piripi Property agent presenting a sold house. The sign says Website coming soon.">
    <h1 class="sr-only">Piripi Property. Website coming soon.</h1>
  </main>
  <a class="site-credit" href="https://grideater.com/our-work" target="_blank" rel="noopener noreferrer" aria-label="Website by GRID EATER. View our work.">Website by <strong>GRID EATER</strong></a>
